$accent = rgb(7aa2f7)
$text = rgb(c0caf5)
$muted = rgb(565f89)
$panel = rgb(1a1b26)

background {
    monitor =
    path = ~/.local/share/phantomos/wallpapers/phantomos-night.png
    blur_passes = 2
    blur_size = 4
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 320, 58
    position = 0, -80
    halign = center
    valign = center
    inner_color = $panel
    outer_color = $accent
    font_color = $text
    check_color = $accent
    fail_color = rgb(f7768e)
    rounding = 18
    outline_thickness = 2
    placeholder_text = <span foreground="$muted">Enter password</span>
    fail_text = <span foreground="$text">Authentication failed</span>
    fade_on_empty = false
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $muted
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
