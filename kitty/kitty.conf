# PhantomOS Tokyo Night terminal palette
font_family JetBrainsMono Nerd Font
font_size 11.0
confirm_os_window_close 0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0
scrollback_lines 10000

background #1a1b26
foreground #c0caf5
selection_background #33467c
selection_foreground #c0caf5
cursor #c0caf5
cursor_text_color #1a1b26
url_color #7dcfff

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #ff899d
color10 #b9f27c
color11 #ff9e64
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5

window_padding_width 10
background_opacity 0.97
# Ctrl+Shift is the system keyboard-layout toggle, so keep Kitty clipboard keys separate.
map ctrl+shift+c
map ctrl+shift+v
map --allow-fallback=shifted,ascii ctrl+alt+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+alt+v paste_from_clipboard
